<!doctype html>
<html lang="es">
  <head>
    <script>
      // Suppress transient Vite HMR WebSocket connection notices in iframe preview
      window.addEventListener('error', function (e) {
        if (e && (e.message?.includes('WebSocket') || e.filename?.includes('vite/client') || e.error?.message?.includes('WebSocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && (e.reason?.message?.includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Super Redes - Asistente para Asesores Técnicos</title>
